# Catálogo editable de productos. Modificá descripciones y FAQs y luego hacé
# `git pull` + restart del servicio en el VPS.
#
# IMPORTANTE: este catálogo NO contiene precios. Los precios y la cotización
# viven únicamente en los PDFs de presupuesto (ver sección `presupuestos` al
# final). El asistente nunca debe inventar ni decir montos por chat: solo
# identifica el producto y mandar el PDF que corresponde.

productos:

  gestion_redes:
    nombre: "Gestión de Redes Sociales"
    presupuesto: rrss_pauta
    keywords:
      - redes
      - social
      - instagram
      - tiktok
      - contenido
      - posteos
      - reels
      - community
      - gestion
      - feed
    descripcion: >-
      Producción integral de contenidos para redes sociales: ideamos,
      planificamos, guionamos, grabamos, producimos, editamos y publicamos.
      Incluye placas gráficas y contenido audiovisual. El cliente se
      desentiende de la tarea.
    incluye:
      - Gestión de redes con planificación mensual (Facebook e Instagram)
      - Producción y edición de videos de baja/media complejidad (reels)
      - Diseño de piezas gráficas
      - Contacto diario y permanente por grupo de WhatsApp
      - Planificación, producción y edición de todo el contenido publicado
    problema: >-
      Muchas empresas publican sin estrategia, sin constancia y sin tiempo para
      producir contenido de calidad. Eso frena el crecimiento de la marca y
      desperdicia el potencial de las redes como canal de ventas.
    beneficios:
      - "El cliente se desentiende de la tarea: nos ocupamos de todo de punta a punta"
      - Contenido planificado, profesional y con constancia mensual
      - Comunicación diaria por grupo de WhatsApp
      - Marca ordenada y presente en Facebook e Instagram
    ideal_para: >-
      Empresas y emprendedores con CUIT que quieren tener presencia profesional
      en redes sociales sin destinar tiempo interno a producir contenido.
    faqs:
      - pregunta: "¿Cuánto sale la gestión de redes?"
        respuesta: "Te preparo el presupuesto con todos los valores y te lo paso en PDF. Trabajamos con Factura A. Es un plan mensual que ajustamos a tus objetivos en una reunión."
      - pregunta: "¿Cuántos posteos incluye por mes?"
        respuesta: "Trabajamos con planes personalizados según objetivos. En general entre 8 y 20 piezas mensuales combinando reels, carruseles y placas."
      - pregunta: "¿Ustedes graban el contenido o lo tengo que mandar yo?"
        respuesta: "Nosotros nos encargamos de la producción audiovisual completa. Coordinamos jornadas de grabación según el plan contratado."
      - pregunta: "¿Hay permanencia mínima?"
        respuesta: "Recomendamos un mínimo de 3 meses para poder medir resultados, pero lo conversamos en la reunión."

  pauta_meta:
    nombre: "Pauta Publicitaria en Meta (Facebook + Instagram)"
    presupuesto: rrss_pauta
    keywords:
      - pauta
      - publicidad
      - ads
      - anuncios
      - meta
      - facebook
      - instagram
      - campañas
      - campania
      - leads
      - factura
      - tarjeta
      - transferencia
      - credito
    descripcion: >-
      Creamos y gestionamos campañas en Meta optimizadas para generar
      resultados reales: visitas a la web, consultas por WhatsApp o leads.
      Contamos con línea de crédito propia en Meta: el cliente paga por
      transferencia y recibe Factura A, deduciendo IVA y Ganancias, sin
      depender de la tarjeta.
    incluye:
      - Creación de anuncios y seguimiento de resultados
      - Gestión de campañas BONIFICADA al contratar Gestión de RRSS
      - Crédito publicitario en Meta pagado por transferencia con Factura A
      - Reportes de resultados
    problema: >-
      Pagar pauta con tarjeta personal no permite deducir IVA ni Ganancias, no
      da factura y limita la inversión. Además, sin gestión profesional las
      campañas no se optimizan y el dinero se gasta sin generar resultados reales.
    beneficios:
      - Pagás la pauta por transferencia y recibís Factura A (deducís IVA y Ganancias)
      - "Línea de crédito propia en Meta: no dependés de la tarjeta personal"
      - Campañas optimizadas para resultados reales (visitas, consultas, leads)
      - Gestión BONIFICADA si contratás Gestión de Redes
      - Seguimiento y reportes de resultados mes a mes
    ideal_para: >-
      Empresas que ya invierten en pauta o quieren empezar, y que necesitan
      facturar la inversión publicitaria y profesionalizar sus campañas en Meta.
    faqs:
      - pregunta: "¿Cuánto sale que me manejen la pauta?"
        respuesta: "La gestión de campañas va BONIFICADA si contratás Gestión de Redes. Aparte está el crédito publicitario que pagás por transferencia con Factura A. Te paso el presupuesto en PDF con el detalle de la inversión."
      - pregunta: "¿Cuánto tengo que invertir mínimo en pauta?"
        respuesta: "Lo escalamos según objetivos y rubro. El detalle de la carga mínima y el fee de agencia va en el presupuesto en PDF, y lo terminamos de definir en la reunión."
      - pregunta: "¿Cómo es lo de la Factura A y la línea de crédito en Meta?"
        respuesta: "Tenemos línea de crédito propia en Meta. Vos nos transferís y nosotros pagamos la pauta. Te emitimos Factura A por gestión + inversión, así deducís IVA y Ganancias y dejás de pagar con tarjeta personal."
      - pregunta: "¿En cuánto tiempo veo resultados?"
        respuesta: "Las campañas suelen necesitar entre 7 y 14 días para optimizarse. A partir de ahí empezás a ver resultados estables que vamos puliendo mes a mes."

  crm:
    nombre: "Automatización con CRM"
    presupuesto: rrss_crm_pauta
    keywords:
      - crm
      - automatizacion
      - automatización
      - leads
      - conversaciones
      - centralizar
      - whatsapp
      - cierre
      - ventas
      - pipeline
      - bot
    descripcion: >-
      Instalamos nuestro CRM para centralizar todas las consultas que llegan
      desde Instagram, TikTok, web, WhatsApp y Facebook. Con automatizaciones,
      ningún lead se queda sin respuesta y el cliente mejora sus cierres
      porque no se le escapan oportunidades.
    incluye:
      - Configuración inicial de Kommo CRM, setup y puesta en marcha
      - Diseño del proceso comercial junto a tu equipo
      - Configuración de automatizaciones y salesbot
      - Capacitación al equipo de trabajo
      - Reuniones de ajuste, corrección y seguimiento
      - Soporte y asistencia mensual (ajustes y actualizaciones)
    problema: >-
      Las consultas llegan dispersas por Instagram, TikTok, web, WhatsApp y
      Facebook, y muchas se pierden sin respuesta. Sin un sistema central, el
      equipo no hace seguimiento y se escapan oportunidades de venta.
    como_funciona:
      - Centralizá todos tus canales digitales en un solo panel
      - Recibí y respondé mensajes desde un único lugar
      - Hacé seguimiento con tu equipo en tiempo real
      - Automatizá tareas repetitivas con salesbot y enfocá la energía en vender
    beneficios:
      - Ningún lead se queda sin respuesta gracias a las automatizaciones
      - Mejores cierres porque no se escapan oportunidades
      - Equipo trabajando ordenado, con proceso comercial claro
      - Somos socios oficiales de Kommo (Kommo Partner)
    ideal_para: >-
      Empresas con flujo de consultas por varios canales que quieren ordenar su
      proceso comercial y automatizar el seguimiento de leads.
    faqs:
      - pregunta: "¿Cuánto cuesta implementar el CRM?"
        respuesta: "Es una configuración con un pago único de puesta en marcha más un soporte mensual. Te paso el presupuesto en PDF con todos los valores; incluye setup, diseño del proceso comercial, automatizaciones y capacitación."
      - pregunta: "¿Es un CRM propio o usan uno de terceros?"
        respuesta: "Trabajamos sobre Kommo, una plataforma robusta de la que somos socios oficiales, a la que sumamos nuestras automatizaciones y configuración para que quede a medida de tu operación."
      - pregunta: "¿Puede integrarse con WhatsApp?"
        respuesta: "Sí. Centralizamos las conversaciones de WhatsApp, Instagram, Facebook, TikTok y formularios web en un solo lugar."
      - pregunta: "¿Quién atiende los chats: ustedes o mi equipo?"
        respuesta: "El CRM lo opera tu equipo comercial; nosotros configuramos el sistema, las automatizaciones y los flujos para que no se les escape nada."

  concilia:
    nombre: "Concilia — Conciliación Bancaria con IA"
    presupuesto: concilia
    keywords:
      - concilia
      - conciliacion
      - conciliación
      - bancaria
      - banco
      - pagos
      - erp
      - administracion
      - administración
      - cobranzas
      - tesoreria
      - tesorería
      - contabilidad
    descripcion: >-
      Software de conciliación bancaria con Inteligencia Artificial.
      Reduce drásticamente la carga operativa de comprobar pagos recibidos
      y cotejarlos con el sistema de gestión (ERP) y el banco. Personalizado
      y vinculado al sistema del cliente.
    incluye:
      - Implementación a medida del software ConciliA, 100% ajustado a tu proceso
      - Vínculo con tu sistema de gestión (ERP)
      - Capacitación a tu equipo para operar la herramienta
      - Servicios de estructura (VPS, n8n, webhook de integración con Kommo)
      - Asistencia mensual y cambios en el funcionamiento del asistente
    problema: >-
      Un administrativo dedica entre 2 y 4 horas diarias a revisar movimientos
      bancarios, descargar comprobantes, verificar transferencias y conciliar a
      mano cada operación: unas 88 horas por mes y más de 1.000 horas al año en
      tareas repetitivas, con errores humanos, demoras y cuellos de botella.
    como_funciona:
      - Envía comprobante (por WhatsApp y otros canales)
      - Digitalización automática del comprobante
      - Búsqueda y cotejo contra el banco y el ERP
      - Relaciona pagos automáticamente
      - Listo para conciliar en minutos
    beneficios:
      - Reduce la carga operativa del equipo y libera tiempo para tareas estratégicas
      - Reduce márgenes de error con validaciones inteligentes
      - "Mayor velocidad operativa: lo que antes tomaba horas se hace en minutos"
      - Mejor control financiero con información centralizada y trazable
      - Reduce costos ocultos (horas improductivas y retrabajos)
      - Escalable, ideal para empresas con gran volumen de transferencias
    integraciones:
      - Conexión directa con extractos y movimientos bancarios en tiempo real
      - Se vincula a tu ERP, software contable, CRM y plataformas internas
      - Sin pérdida de información histórica y sin modificar procesos internos
    ideal_para: >-
      Empresas con alto volumen de pagos y transferencias que pierden horas
      conciliando manualmente y quieren automatizar el proceso de punta a punta.
    faqs:
      - pregunta: "¿Cuánto cuesta ConciliA?"
        respuesta: "Es una implementación a medida con un pago único de configuración más una asistencia mensual. Te paso el presupuesto en PDF con todos los valores; lo ajustamos 100% a tu proceso, lo vinculamos con tu sistema de gestión y capacitamos a tu equipo."
      - pregunta: "¿Con qué bancos y ERPs se integra?"
        respuesta: "Trabajamos con los principales bancos argentinos y los ERPs más comunes. Lo evaluamos según tu stack en la reunión."
      - pregunta: "¿Cuánto tiempo lleva la implementación?"
        respuesta: "Depende del volumen y la complejidad, pero los primeros resultados aparecen en las primeras semanas."

  turneria:
    nombre: "Turnería — Gestión de Turnos para Salud"
    presupuesto: turneria
    keywords:
      - turnos
      - turneria
      - turnería
      - agenda
      - clinica
      - clínica
      - sanatorio
      - policonsultorio
      - medico
      - médico
      - paciente
      - pacientes
      - salud
      - consultorio
    descripcion: >-
      TurnerIA: asistente de turnos con Inteligencia Artificial por WhatsApp,
      100% adaptado a tu consultorio o clínica. Un agente de IA conectado a tu
      sistema de gestión que atiende 24/7, toma, reprograma y cancela turnos,
      y envía recordatorios automáticos, reduciendo la tarea manual de la
      secretaría.
    incluye:
      - Agente de IA para WhatsApp atendiendo 24/7
      - Toma, reprogramación y cancelación de turnos
      - Recordatorios automáticos a cada paciente
      - Integración con tu sistema de gestión y lista de pacientes
      - Asistencia mensual y cambios en el funcionamiento del asistente
    problema: >-
      La secretaría pierde gran parte del día atendiendo llamadas y mensajes para
      dar, mover o cancelar turnos, y fuera del horario de atención los pacientes
      quedan sin respuesta. El ausentismo y la tarea manual generan pérdidas.
    como_funciona:
      - WhatsApp 24/7, atención automática sin interrupciones
      - "Gestión completa: toma, reprogramación y cancelación de turnos"
      - Recordatorios automáticos para cada paciente
      - Integración total con tus herramientas y sistema de gestión actual
    beneficios:
      - Reduce la tarea manual de la secretaría
      - Atención 24/7 sin perder pacientes fuera de horario
      - Menos ausentismo gracias a recordatorios y cobro por adelantado
      - Seguís usando tu sistema actual, ahora con atención automatizada
    ideal_para: >-
      Desde consultorios y profesionales individuales hasta policonsultorios,
      clínicas y sanatorios con varios profesionales y consultorios.
    faqs:
      - pregunta: "¿Cuánto cuesta TurnerIA?"
        respuesta: "Es la configuración del agente de IA con un pago único más una asistencia mensual. Te paso el presupuesto en PDF con todos los valores; incluye la creación del agente integrado a tu sistema de gestión."
      - pregunta: "¿Se integra con el sistema que ya uso?"
        respuesta: "Sí. Conectamos el agente de IA a tu sistema de gestión actual y a tu lista de pacientes, así seguís usando tu sistema pero con la atención automatizada por WhatsApp."
      - pregunta: "¿Sirve para un consultorio individual o solo para clínicas?"
        respuesta: "Funciona para ambos: desde profesionales individuales hasta policonsultorios y sanatorios con varios profesionales y consultorios."
      - pregunta: "¿Puede cobrar la consulta por adelantado?"
        respuesta: "Sí. Turnería permite cobrar la consulta al momento de reservar el turno, reduciendo ausentismo."
      - pregunta: "¿Envía recordatorios por WhatsApp?"
        respuesta: "Sí, envía recordatorios automáticos a los pacientes para confirmar o cancelar el turno."

  desarrollo_software:
    nombre: "Desarrollo de Software a Medida"
    presupuesto: null   # Se cotiza a medida tras relevamiento; no hay PDF estándar
    keywords:
      - software
      - desarrollo
      - desarrollar
      - medida
      - sistema
      - sistemas
      - erp
      - app
      - aplicacion
      - aplicación
      - web
      - pagina
      - página
      - plataforma
      - automatizacion
      - automatización
      - automatizaciones
      - integracion
      - integración
      - integraciones
      - api
      - programacion
      - programación
      - bot
      - agente
      - ia
    descripcion: >-
      Desarrollamos software a medida de punta a punta: hacemos de todo, desde un
      ERP o sistema de gestión completo hasta automatizaciones complejas e
      integraciones entre sistemas. Relevamos tu proceso, diseñamos la solución y
      la dejamos funcionando, adaptada 100% a cómo trabaja tu empresa.
    incluye:
      - Relevamiento y análisis del proceso a digitalizar o automatizar
      - Desarrollo de ERP y sistemas de gestión a medida
      - Aplicaciones web y plataformas internas
      - Automatizaciones complejas (n8n, agentes de IA, bots)
      - Integraciones con APIs, bancos, CRMs y sistemas externos
      - Puesta en marcha, capacitación y soporte
    problema: >-
      Las herramientas genéricas rara vez encajan con cómo trabaja realmente una
      empresa: quedan procesos manuales, planillas sueltas y sistemas que no se
      hablan entre sí. Eso genera errores, retrabajo y techo para crecer.
    como_funciona:
      - Relevamos tu proceso y definimos el alcance
      - Diseñamos la solución a medida (sistema, app o automatización)
      - Desarrollamos e integramos con tus sistemas actuales
      - Lo dejamos funcionando, capacitamos al equipo y damos soporte
    beneficios:
      - Solución 100% adaptada a tu operación, no al revés
      - Desde un ERP completo hasta automatizaciones puntuales
      - Integra y conecta los sistemas que hoy no se hablan entre sí
      - Reduce tareas manuales, errores y costos ocultos
      - "Escalable: el sistema crece con tu empresa"
    ideal_para: >-
      Empresas que necesitan un sistema o automatización a medida que las
      herramientas estándar no resuelven, o que quieren integrar y automatizar
      procesos propios.
    faqs:
      - pregunta: "¿Qué tipo de software desarrollan?"
        respuesta: "Hacemos de todo a medida: desde un ERP o sistema de gestión completo hasta aplicaciones web, integraciones entre sistemas y automatizaciones complejas con n8n y agentes de IA. Lo adaptamos 100% a tu proceso."
      - pregunta: "¿Cuánto cuesta un desarrollo a medida?"
        respuesta: "Depende del alcance y la complejidad del proyecto, así que se cotiza a medida. Hacemos un relevamiento inicial sin cargo para entender qué necesitás y después pasamos una propuesta concreta."
      - pregunta: "¿Se integra con los sistemas que ya uso?"
        respuesta: "Sí. Nos especializamos en integrar y conectar sistemas que hoy no se hablan entre sí (ERPs, CRMs, bancos, APIs) y automatizar los procesos que los unen."
      - pregunta: "¿Pueden automatizar un proceso puntual o solo proyectos grandes?"
        respuesta: "Las dos cosas. Resolvemos desde una automatización puntual que te ahorra tareas manuales hasta el desarrollo de un sistema completo de gestión."

# ---------------------------------------------------------------------------
# Presupuestos en PDF
# ---------------------------------------------------------------------------
# Único lugar donde viven los precios: los PDFs. El asistente NO dice montos;
# solo identifica qué PDF corresponde y devuelve su nombre de archivo para que
# n8n lo adjunte/envíe.
#
# Guardá cada PDF en `data/presupuestos/` con EXACTAMENTE el nombre de `archivo`.
# Si servís los PDFs por HTTP (ver PRESUPUESTOS_BASE_URL en .env), el MCP arma
# la URL pública sumando base_url + archivo.
presupuestos:

  rrss_pauta:
    archivo: "presupuesto-rrss-pauta.pdf"
    etiqueta: "Presupuesto · Gestión de Redes + Pauta en Meta"
    cubre:
      - gestion_redes
      - pauta_meta

  rrss_crm_pauta:
    archivo: "presupuesto-rrss-crm-pauta.pdf"
    etiqueta: "Presupuesto · Redes + CRM + Pauta en Meta"
    cubre:
      - gestion_redes
      - crm
      - pauta_meta

  concilia:
    archivo: "presupuesto-concilia.pdf"
    etiqueta: "Presupuesto · Plataforma ConciliA"
    cubre:
      - concilia

  turneria:
    archivo: "presupuesto-turneria.pdf"
    etiqueta: "Presupuesto · TurnerIA (Gestión de Turnos)"
    cubre:
      - turneria

# Criterios para identificar si una persona puede ser cliente
criterios_cliente:
  - "Empresa o emprendedor con CUIT activo"
  - "Empresa que ya invierte en comunicación digital o quiere empezar"
  - "Empresa que quiere dejar de pagar pauta con tarjeta y pasar a transferencia con Factura A"
  - "Empresa que busca automatizar procesos manuales del área administrativa o comercial"
