[project]
name = "mcp-consultoria-digital"
version = "0.1.0"
description = "MCP server con herramientas para el asistente comercial de Consultoría Digital (n8n + GPT + WaSender)"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.3.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
    "starlette>=0.37",
]

[tool.setuptools]
packages = ["src"]
